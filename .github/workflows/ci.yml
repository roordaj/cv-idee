name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Lint (ruff check + ruff format --check)
        run: make lint-backend
      - name: Typecheck (mypy --strict)
        run: make typecheck-backend
      - name: Test (pytest)
        run: make test-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint + prettier --check)
        run: make lint-frontend
      - name: Typecheck (tsc --noEmit)
        run: make typecheck-frontend
      - name: Test (vitest)
        run: make test-frontend
      - name: Build
        run: make build

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check api/openapi.json matches generated spec
        # TODO(#11): once the API contract lands, check out the repo, generate the
        # OpenAPI spec from the backend and fail if it differs from api/openapi.json.
        run: echo "No-op until #11 adds api/openapi.json."
