# Home Assistant add-on configuration for CV-analyse (CV-idee).
# https://developers.home-assistant.io/docs/add-ons/configuration
name: CV-analyse
version: "0.1.1"
slug: cv_analyse
image: "ghcr.io/roordaj/cv-idee-addon-{arch}"
description: Alleen-lezen analyse en advies voor je cv-ketel op basis van Home Assistant-gegevens.
url: https://github.com/roordaj/cv-idee
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: CV-analyse
homeassistant_api: true
services:
  - mqtt:want
map:
  - data:rw
options:
  log_level: info
  retentie_dagen: 180
  can_gateway_entity_id: ""
  can_gateway_roles: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  retentie_dagen: int(7,3650)
  can_gateway_entity_id: str?
  can_gateway_roles: str?
  notify_doel: str?
