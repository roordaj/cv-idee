name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --project backend --locked
      - name: Lint (ruff check + ruff format --check)
        run: make lint-backend
      - name: Typecheck (mypy --strict)
        run: make typecheck-backend
      - name: Start MQTT integration test broker
        run: docker compose -f docker-compose.dev.yml up -d mosquitto
      - name: Test (pytest)
        env:
          CVIDEE_TEST_MQTT_HOST: 127.0.0.1
        run: make test-backend
      - name: Stop MQTT integration test broker
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint + prettier --check)
        run: make lint-frontend
      - name: Typecheck (tsc --noEmit)
        run: make typecheck-frontend
      - name: Test (vitest)
        run: make test-frontend
      - name: Build
        run: make build

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --project backend --locked
          cd frontend && npm ci
      - name: Regenerate OpenAPI spec and frontend types
        run: make openapi
      - name: Fail if api/openapi.json or frontend/src/api/schema.d.ts is outdated
        run: |
          git diff --exit-code -- api/openapi.json frontend/src/api/schema.d.ts \
            || { echo "::error::Contract out of date: run 'make openapi' and commit."; exit 1; }
