configuration:
  log_level:
    name: Logniveau
    description: Hoeveel details de add-on in het log schrijft.
  retentie_dagen:
    name: Bewaartermijn (dagen)
    description: Hoe lang ruwe waarnemingen bewaard blijven. Samenvattingen en advieshistorie blijven langer bewaard.
  notify_doel:
    name: Meldingsdoel
    description: Naam van de notify-service voor meldingen, bijvoorbeeld mobile_app_telefoon (zonder "notify."). Leeg laten om alleen het HA-event cv_analyse_finding te sturen.
  can_gateway_entity_id:
    name: CAN-gateway-entiteit
    description: HA-entiteit die beschikbaarheid van de CAN-gateway aangeeft. Leeg laten als die niet is gekoppeld.
  can_gateway_roles:
    name: CAN-signaalrollen
    description: Komma-gescheiden rollen van gekoppelde signalen die via de CAN-gateway binnenkomen, bijvoorbeeld flow_temperature,return_temperature.
